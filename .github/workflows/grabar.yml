name: 🔴 Grabar Arlo

on:
  workflow_dispatch:
    inputs:
      camara:
        description: "Nombre de la cámara (vacío = la primera)"
        required: false
        default: ""
      max_minutos:
        description: "Tope de minutos (para antes con Cancelar)"
        required: false
        default: "120"

permissions:
  contents: write

concurrency:
  group: grabacion
  cancel-in-progress: false

jobs:
  grabar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q pyaarlo

      - name: Recuperar sesión de Arlo
        uses: actions/cache/restore@v4
        with:
          path: arlo-estado
          key: arlo-estado-${{ github.run_id }}
          restore-keys: arlo-estado-

      - name: ⏺ Grabando (pulsa Cancelar para parar)
        env:
          ARLO_USER: ${{ secrets.ARLO_USER }}
          ARLO_PASS: ${{ secrets.ARLO_PASS }}
          TFA_EMAIL: ${{ secrets.TFA_EMAIL }}
          TFA_APP_PASSWORD: ${{ secrets.TFA_APP_PASSWORD }}
          CAMARA: ${{ inputs.camara }}
          MAX_MINUTOS: ${{ inputs.max_minutos }}
        run: python -u grabar.py

      - name: Guardar sesión de Arlo
        if: always()
        uses: actions/cache/save@v4
        with:
          path: arlo-estado
          key: arlo-estado-${{ github.run_id }}

      - name: Unir vídeo y publicarlo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(segmentos/*.mp4)
          if [ ${#files[@]} -eq 0 ]; then echo "No hay nada grabado."; exit 0; fi
          for f in "${files[@]}"; do [ -s "$f" ] && echo "file '$PWD/$f'"; done > lista.txt
          nombre="arlo-$(TZ=Europe/Madrid date +%Y-%m-%d_%H-%M).mp4"
          ffmpeg -hide_banner -loglevel warning -f concat -safe 0 -i lista.txt -c copy -movflags +faststart "$nombre" \
            || ffmpeg -hide_banner -loglevel warning -f concat -safe 0 -i lista.txt -c:v libx264 -preset veryfast -c:a aac -movflags +faststart "$nombre"
          ls -lh "$nombre"
          tag="rec-${{ github.run_id }}"
          gh release create "$tag" "$nombre" --title "${nombre%.mp4}" --notes "Grabación de Arlo (${{ inputs.camara || 'cámara por defecto' }})"
          echo "### 🎬 Vídeo listo: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
